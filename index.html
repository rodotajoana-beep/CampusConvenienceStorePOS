<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Convenience Store POS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Campus Convenience Store POS</h1>
    </header>

    <main>
        <!-- Section 1: Product List -->
        <section id="product-section">
            <h2>Product List</h2>
            <div id="product-list">
                <!-- Products are added here by script.js -->
            </div>
        </section>

        <!-- Section 2: Shopping Cart -->
        <section id="cart-section">
            <h2>Shopping Cart</h2>
            <!-- Short success message shown when an item is added -->
            <div id="cart-message" class="message"></div>
            <!-- Cart table (or "Your cart is empty.") is drawn here by script.js -->
            <div id="cart-items"></div>
        </section>

        <!-- Section 3: Order Summary -->
        <section id="summary-section">
            <h2>Order Summary</h2>
            <p>Total Items: <strong id="total-items">0</strong></p>
            <p>Total Amount: <strong id="total-amount">₱0.00</strong></p>
        </section>

        <!-- Section 4: Payment -->
        <section id="payment-section">
            <h2>Payment</h2>
        </section>

        <!-- Section 5: Receipt -->
        <section id="receipt-section">
            <h2>Receipt</h2>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
